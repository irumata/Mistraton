name: Build and deploy Mistralethon

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after building (disable to publish images only)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: mistraleton-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      owner: ${{ steps.names.outputs.owner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Normalize registry owner
        id: names
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Check frontend and API
        run: |
          set -euo pipefail
          npm --prefix frontend ci --no-audit --no-fund
          npm --prefix frontend run lint
          npm --prefix frontend run build
          python -m pip install -r backend/requirements-dev.txt
          PYTHONPATH=backend python -m pytest -q backend/tests
      - name: Build x86_64 images
        env:
          GH_OWNER: ${{ steps.names.outputs.owner }}
        run: |
          set -euo pipefail
          for component in api web; do
            if [[ "$component" == api ]]; then file=backend/Dockerfile; else file=frontend/Dockerfile; fi
            docker build --platform linux/amd64 --file "$file" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --tag "ghcr.io/$GH_OWNER/mistraleton-$component:$GITHUB_SHA" \
              --tag "ghcr.io/$GH_OWNER/mistraleton-$component:latest" .
          done
      - name: Smoke test full stack and optional worker
        env:
          GH_OWNER: ${{ steps.names.outputs.owner }}
          IMAGE_TAG: ${{ github.sha }}
          SITE_ADDRESS: http://:80
          COMPOSE_PROJECT_NAME: mistraleton-ci
        run: |
          set -euo pipefail
          DB_ADMIN_PASSWORD=$(openssl rand -hex 24)
          DB_PASSWORD=$(openssl rand -hex 24)
          export DB_ADMIN_PASSWORD DB_PASSWORD
          trap 'docker compose --profile jobs down --volumes' EXIT
          docker compose config --quiet
          if ! docker compose up -d --no-build --wait --wait-timeout 180; then
            docker compose logs --no-color --tail 60
            exit 1
          fi
          curl -fsS http://127.0.0.1/ | grep -q '<title>Mistralethon</title>'
          curl -fsS http://127.0.0.1/api/health | python -c 'import json,sys; assert json.load(sys.stdin)["project"] == "Mistralethon"'
          curl -fsS http://127.0.0.1/api/db | python -c 'import json,sys; assert json.load(sys.stdin)["schema_version"] == 1'
          # A second migration must preserve existing data and be safe to repeat.
          docker compose run --rm migrate
          docker compose exec -T api python - <<'PY'
          import psycopg
          with psycopg.connect() as conn:
              assert not conn.execute('SELECT rolsuper FROM pg_roles WHERE rolname = current_user').fetchone()[0]
          PY
          docker compose --profile jobs up -d --no-build --wait --wait-timeout 120
          docker compose exec -T worker python - <<'PY'
          import time
          from redis import Redis
          from rq import Queue
          job = Queue(connection=Redis(host='redis')).enqueue('jobs.add', 20, 22)
          for _ in range(60):
              job.refresh()
              if job.is_finished:
                  assert job.return_value() == 42
                  break
              if job.is_failed:
                  raise SystemExit('Example job failed')
              time.sleep(1)
          else:
              raise SystemExit('Worker did not complete the example job')
          PY
      - name: Publish tested images to GHCR
        env:
          GH_OWNER: ${{ steps.names.outputs.owner }}
          GHCR_TOKEN: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/mistraleton-docker
        run: |
          set -euo pipefail
          mkdir -p "$DOCKER_CONFIG"
          chmod 700 "$DOCKER_CONFIG"
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for component in api web; do
            docker push "ghcr.io/$GH_OWNER/mistraleton-$component:$GITHUB_SHA"
            docker push "ghcr.io/$GH_OWNER/mistraleton-$component:latest"
          done

  deploy:
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Upload release and deploy with verified SSH host key
        env:
          GH_OWNER: ${{ needs.build.outputs.owner }}
          OCI_HOST: ${{ secrets.OCI_HOST || '130.162.187.46' }}
          SSH_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_KEY" && -n "$KNOWN_HOSTS" ]] || { echo 'Set OCI_SSH_PRIVATE_KEY and verified OCI_KNOWN_HOSTS repository secrets. Images have already been published.' >&2; exit 1; }
          [[ "$OCI_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]+$ ]] || { echo 'Invalid OCI_HOST.' >&2; exit 1; }
          [[ "$GH_OWNER" =~ ^[a-z0-9][a-z0-9-]{0,38}$ ]] || exit 1
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/mistraleton-ssh.XXXXXX")
          trap 'rm -rf -- "$ssh_dir"' EXIT
          chmod 700 "$ssh_dir"
          printf '%s\n' "$SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          unset SSH_KEY KNOWN_HOSTS
          options=(-i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          target="opc@$OCI_HOST"
          release="/home/opc/Mistralethon/.releases/$GITHUB_SHA"
          # shellcheck disable=SC2029 # Validated owner and fixed commit-derived paths expand locally.
          ssh "${options[@]}" "$target" "umask 077; mkdir -p '$release/scripts'"
          scp "${options[@]}" compose.yaml "$target:$release/compose.yaml"
          scp "${options[@]}" scripts/deploy.sh "$target:$release/scripts/deploy.sh"
          # stdin carries only the ephemeral Actions token; it is never in a command argument or .env.
          # shellcheck disable=SC2029
          printf '%s\n' "$GHCR_TOKEN" | ssh "${options[@]}" "$target" "bash '$release/scripts/deploy.sh' '$GH_OWNER' '$GITHUB_SHA' '$GITHUB_ACTOR'"
