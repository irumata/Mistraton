<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mistraton</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main>
      <p class="eyebrow">Cloudflare Pages + Oracle Cloud</p>
      <h1>Welcome to Mistraton</h1>
      <p>A simple website, ready for your next idea.</p>
      <section aria-labelledby="backend-title">
        <h2 id="backend-title">Backend connection</h2>
        <p id="message" role="status">Connecting to the API…</p>
        <button id="refresh" type="button">Check again</button>
      </section>
      <p class="hint">Push your changes to main to publish an update.</p>
    </main>
  </body>
</html>
