name: hackathon

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-env: &app-env
  DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-hackathon}:${POSTGRES_PASSWORD:?Generate .env first}@db:5432/${POSTGRES_DB:-hackathon}}
  REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:?Generate .env first}@redis:6379/0}
  ADMIN_API_KEY: ${ADMIN_API_KEY:?Generate .env first}
  WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Generate .env first}
  JOB_TIMEOUT: ${JOB_TIMEOUT:-1200}

x-app: &app
  image: hackathon-app:${RELEASE_ID:-local}
  environment: *app-env
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: *logging
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    image: hackathon-web:${RELEASE_ID:-local}
    build: ./frontend
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Generate .env first}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTP_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging
    security_opt: [no-new-privileges:true]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:2015/health]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    <<: *app
    build: ./backend
    deploy:
      replicas: ${API_REPLICAS:-1}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=8)"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 10s
    stop_grace_period: 40s

  worker:
    <<: *app
    command: [python, -m, app.worker]
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    # Let the current job finish during a deployment; keep >= JOB_TIMEOUT + 60 seconds.
    stop_grace_period: 21m

  migrate:
    <<: *app
    command: [python, -m, app.migrate]
    restart: "no"
    profiles: [tools]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hackathon}
      POSTGRES_DB: ${POSTGRES_DB:-hackathon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Generate .env first}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-256mb}
    command: [sh, -c, 'exec redis-server --appendonly yes --appendfsync everysec --maxmemory "$$REDIS_MAXMEMORY" --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
